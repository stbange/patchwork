<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchwork · Quilt planner</title>
<style>
* {box-sizing:border-box} html,body {margin:0;width:100%;height:100%;background:#f8f5ee}
body {display:grid;place-items:center;color:#253f38;font:18px system-ui,sans-serif}
canvas {display:block;width:min(100vw,150vh);height:auto;max-height:100vh;aspect-ratio:3/2;outline-offset:-3px;touch-action:none}
#loading {position:absolute;pointer-events:none}
#current-view {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style></head><body>
<p id="loading" role="status">Opening the design wall…</p>
<canvas id="canvas" width="1080" height="720" tabindex="0" aria-label="Patchwork"></canvas>
<p id="current-view" role="status"></p>
<script>
var Module = (() => {
  const messages = {
    en: ['Quilt planner', 'Opening the design wall…', 'The quilt planner could not start. Reload the page to try again.'],
    de: ['Quiltplaner', 'Entwurfswand wird geöffnet…', 'Der Quiltplaner konnte nicht starten. Lade die Seite erneut.'],
    pl: ['Planer kołdry', 'Otwieranie planszy…', 'Nie udało się uruchomić planera. Odśwież stronę i spróbuj ponownie.']
  };
  const supported = tag => /^(en|de|pl)$/.test(tag);
  let prefs;
  try { prefs = localStorage.getItem('patchwork.settings'); } catch (_) {}
  if (!/^(en|de|pl) (in|cm)$/.test(prefs)) {
    const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
    const lang = languages.map(tag => tag?.toLowerCase().split(/[-_]/)[0]).find(supported) || 'en';
    prefs = lang + (lang === 'en' ? ' in' : ' cm');
  }
  const loading = document.getElementById('loading');
  const canvas = document.getElementById('canvas');
  function language(tag) {
    if (document.documentElement.lang !== tag) document.documentElement.lang = tag;
    const title = 'Patchwork · ' + messages[tag][0];
    if (document.title !== title) document.title = title;
    if (loading.textContent !== messages[tag][1]) loading.textContent = messages[tag][1];
  }
  language(prefs.slice(0, 2));
  return {
    canvas,
    patchworkSettings: prefs,
    patchworkLanguage: language,
    onRuntimeInitialized() { loading.remove(); canvas.focus(); },
    onAbort() { document.body.textContent = messages[document.documentElement.lang][2]; }
  };
})();
</script>
{{{ SCRIPT }}}
</body></html>
