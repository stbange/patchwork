name: Build and test the quilt planner
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  linux:
    name: Linux, unit coverage and desktop journey
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@2.1.1 validate --all --strict
        env:
          OPENSPEC_TELEMETRY: '0'
      - name: Install display and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libgl1-mesa-dev xvfb xdotool xclip
          pipx install gcovr==8.8
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPATCHWORK_COVERAGE=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=TRUE
          cmake --build build --parallel 4
      - name: Unit tests and coverage gate
        run: |
          ctest --test-dir build --output-on-failure
          gcovr --root . --filter '^src/' --txt --json-summary build/coverage.json --fail-under-line 95 build/CMakeFiles/workroom.dir
      - name: Build the portable release
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPATCHWORK_COVERAGE=OFF
          cmake --build build --target patchwork --parallel 4
          tar -C build/app -czf patchwork-linux-x64.tar.gz patchwork assets
      - name: Drive the Linux window
        run: xvfb-run -a -s '-screen 0 1440x940x24' python3 tests/desktop_e2e.py build/app/patchwork
      - uses: actions/upload-artifact@v4
        with:
          name: patchwork-linux-x64
          path: patchwork-linux-x64.tar.gz

  windows:
    name: Windows desktop journey
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -A x64 -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=TRUE
          cmake --build build --config Release --parallel 4
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Drive the Windows window
        run: python tests/desktop_e2e.py build/app/Release/patchwork.exe
      - uses: actions/upload-artifact@v4
        with:
          name: patchwork-windows-x64
          path: |
            build/app/Release/patchwork.exe
            build/app/Release/assets/

  web:
    name: Emscripten and Chromium journey
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with Emscripten
        run: |
          git clone --quiet --depth 1 --branch 4.0.15 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.15
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.15
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-web --parallel 4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Drive the browser
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/web_e2e.py build-web/app --also-open-file
      - uses: actions/upload-artifact@v4
        with:
          name: patchwork-web
          path: build-web/app/index.html
